      - 舔舐皮肤残留
      - 经皮
    physical_form: 液体
    form_risk: 高
    toxicity_level: 极高
    danger_level: 极高
    commonness: 一般
    sources:
      - "ASPCA: Minoxidil"
      - "Pet Poison Helpline: Minoxidil"
    confirmation_status: 已确认
    last_reviewed: "2026-10-24"

